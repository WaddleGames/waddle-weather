<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Dust Storm</title>
  <desc id="desc">Sand-colored gusts and blowing dust</desc>
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3d49a"/>
      <stop offset=".45" stop-color="#c99a62"/>
      <stop offset="1" stop-color="#96704e"/>
    </linearGradient>
    <linearGradient id="sandLight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffe6ad"/>
      <stop offset="1" stop-color="#d8aa6d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#081522" flood-opacity=".8"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" filter="url(#shadow)">
    <path d="M8 22h27c5.7 0 9.2-2.8 9.2-6.4 0-2.9-2.2-5-5-5-2.1 0-3.9 1.1-4.8 2.8" stroke="url(#sandLight)" stroke-width="4"/>
    <path d="M6 32h43c5.4 0 8.8-2.7 8.8-6 0-2.7-2-4.6-4.6-4.6" stroke="url(#sand)" stroke-width="4.5"/>
    <path d="M12 42h30c5 0 8.1 2.6 8.1 5.8 0 2.7-2 4.6-4.6 4.6-2.2 0-3.9-1.1-4.8-3" stroke="url(#sandLight)" stroke-width="4"/>
  </g>
  <g fill="#d3a16a" opacity=".95" filter="url(#shadow)">
    <circle cx="12" cy="51" r="2.2"/>
    <circle cx="18" cy="56" r="1.4"/>
    <circle cx="54" cy="39" r="2"/>
    <circle cx="58" cy="45" r="1.2"/>
    <circle cx="49" cy="13" r="1.5"/>
  </g>
</svg>