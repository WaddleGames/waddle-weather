<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Hail</title>
  <desc id="desc">A pale storm cloud dropping icy hailstones</desc>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#d8e9f4"/>
      <stop offset="1" stop-color="#a7c5da"/>
    </linearGradient>
    <radialGradient id="ice" cx=".3" cy=".2">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#d5f5ff"/>
      <stop offset="1" stop-color="#81d4fa"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#081522" flood-opacity=".75"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M12 31.5h39.5c4.3 0 7-2.7 7-6.2 0-3.7-3-6.4-6.8-6.4-.8 0-1.5.1-2.2.3-2-5.3-6.7-8.3-12.2-8.3-6 0-10.9 3.6-12.5 8.8-.7-.2-1.4-.3-2.2-.3-4.5 0-8.1 2.9-8.1 6.5s1.8 5.6 5.5 5.6Z" fill="url(#cloud)" stroke="#f2fbff" stroke-width="1"/>
    <circle cx="18" cy="43" r="4" fill="url(#ice)" stroke="#b9efff" stroke-width=".8"/>
    <circle cx="30" cy="49" r="4.8" fill="url(#ice)" stroke="#b9efff" stroke-width=".8"/>
    <circle cx="43" cy="42" r="3.7" fill="url(#ice)" stroke="#b9efff" stroke-width=".8"/>
    <circle cx="52" cy="51" r="3.1" fill="url(#ice)" stroke="#b9efff" stroke-width=".8"/>
  </g>
</svg>